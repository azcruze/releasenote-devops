{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<section class="panel empty error-page">
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">Back to dashboard</a>
</section>
{% endblock %}
